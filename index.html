<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WM Tagger - Audio Tag Editor</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/mp3tag.js@latest/dist/mp3tag.min.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="container">
    <h2>WM Tagger</h2>

    <div class="field drop-zone" id="dropZone">
      <label for="audioFile">Drop audio file (.mp3 or .wav) here or click to browse</label>
      <input type="file" id="audioFile" accept=".mp3,.wav,audio/mpeg,audio/wav">
    </div>

    <div id="form" style="display:none;">
      <div class="player-container">
        <button type="button" id="playPauseBtn" class="play-btn">Play</button>
        <div class="waveform-wrapper" id="waveformWrapper">
          <canvas id="waveformCanvas"></canvas>
        </div>
        <div class="volume-control">
          <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.8" title="Volume">
        </div>
      </div>

      <div class="field"><label>Title</label><input type="text" id="title"></div>
      <div class="grid">
        <div class="field"><label>Artist</label><input type="text" id="artist"></div>
        <div class="field"><label>Composer</label><input type="text" id="composer"></div>
      </div>
      <div class="grid">
        <div class="field"><label>Key</label><input type="text" id="key" placeholder="e.g. 8A or Cmin"></div>
        <div class="field"><label>BPM</label><input type="number" id="bpm" placeholder="128"></div>
      </div>
      <div class="grid">
        <div class="field"><label>Year</label><input type="text" id="year"></div>
        <div class="field"><label>Genre</label><input type="text" id="genre"></div>
      </div>
      <div class="grid">
        <div class="field">
          <label>LUFS</label>
          <div class="input-with-btn">
            <input type="text" id="lufs" placeholder="-9.0 LUFS">
            <button type="button" id="calcLufsBtn" class="btn-inline" title="Calculate integrated LUFS">Analyze</button>
          </div>
        </div>
        <div class="field"><label>Comment</label><input type="text" id="comment" placeholder="Notes or URL"></div>
      </div>
      <div class="field">
        <label>Artwork (JPG / PNG)</label>
        <input type="file" id="coverFile" accept="image/jpeg,image/png" class="field-input">
        <img id="coverPreview" alt="Artwork Preview">
        <button type="button" id="removeCoverBtn" class="btn-danger">Remove Artwork</button>
      </div>
      <button id="saveBtn">Save & Download</button>
      <div id="statusLine" class="status-line"></div>
    </div>
  </div>
</body>
</html>
