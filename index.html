<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WM Tagger - Audio Tag Editor</title>
  <script src="https://cdn.jsdelivr.net/npm/mp3tag.js@latest/dist/mp3tag.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121214; color: #e0e0e6; padding: 20px; margin: 0; }
    .container { max-width: 550px; margin: 0 auto; background: #1a1a1e; border: 1px solid #2e2e35; border-radius: 12px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h2 { margin-top: 0; text-align: center; color: #fff; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 20px; }
    .field { margin-bottom: 14px; }
    .drop-zone { border: 2px dashed #33333d; padding: 30px; border-radius: 8px; text-align: center; background: #24242a; transition: border-color 0.3s, background-color 0.3s, color 0.3s; cursor: pointer; color: #a0a0ab; font-size: 14px; }
    .drop-zone.hover { border-color: #3b82f6; background-color: #1a1a1e; color: #fff; }
    .drop-zone label { display: block; cursor: pointer; }
    .drop-zone input[type="file"] { position: absolute; width: 0; height: 0; opacity: 0; }
    input[type="text"], input[type="number"], input[type="file"].field-input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #33333d; background: #24242a; color: #fff; font-size: 14px; }
    input[type="file"].field-input { cursor: pointer; padding: 7px; }
    label { display: block; margin-bottom: 6px; font-size: 13px; color: #a0a0ab; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button { background: #3b82f6; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: 600; font-size: 15px; margin-top: 10px; }
    button:hover { background: #2563eb; }
    #coverPreview { max-width: 120px; border-radius: 6px; margin-top: 8px; display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h2>WM Tagger</h2>
    
    <div class="field drop-zone" id="dropZone">
      <label for="audioFile">Перетащите файл (.mp3 или .wav) сюда или нажмите для выбора</label>
      <input type="file" id="audioFile" accept=".mp3,.wav,audio/mpeg,audio/wav">
    </div>

    <div id="form" style="display:none;">
      <div class="field"><label>Название трека</label><input type="text" id="title"></div>
      <div class="grid">
        <div class="field"><label>Исполнитель</label><input type="text" id="artist"></div>
        <div class="field"><label>Композитор</label><input type="text" id="composer"></div>
      </div>
      <div class="grid">
        <div class="field"><label>Тональность (Key)</label><input type="text" id="key" placeholder="например, 8A или Cmin"></div>
        <div class="field"><label>BPM</label><input type="number" id="bpm" placeholder="128"></div>
      </div>
      <div class="grid">
        <div class="field"><label>Год</label><input type="text" id="year"></div>
        <div class="field"><label>Жанр</label><input type="text" id="genre"></div>
      </div>
      <div class="field">
        <label>Обложка (JPG / PNG)</label>
        <input type="file" id="coverFile" accept="image/jpeg,image/png" class="field-input">
        <img id="coverPreview" alt="Artwork Preview">
      </div>
      <button id="saveBtn">Сохранить и скачать</button>
    </div>
  </div>

  <script>
    let rawAudioBuffer = null;
    let originalFileName = "";
    let coverBuffer = null;
    let coverMime = "";
    let existingCoverData = null;

    const dropZone = document.getElementById('dropZone');
    const audioFileInput = document.getElementById('audioFile');
    const form = document.getElementById('form');

    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, e => { e.preventDefault(); e.stopPropagation(); }, false);
    });

    ['dragenter', 'dragover'].forEach(eventName => {
      dropZone.addEventListener(eventName, () => dropZone.classList.add('hover'), false);
    });
    ['dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, () => dropZone.classList.remove('hover'), false);
    });

    dropZone.addEventListener('drop', e => {
      const file = e.dataTransfer.files[0];
      if (file) processAudioFile(file);
    });

    audioFileInput.addEventListener("change", e => {
      const file = e.target.files[0];
      if (file) processAudioFile(file);
    });

    function parseWavChunks(buffer) {
      if (buffer.byteLength < 12) return null;
      const view = new DataView(buffer);
      const riff = String.fromCharCode(view.getUint8(0), view.getUint8(1), view.getUint8(2), view.getUint8(3));
      const wave = String.fromCharCode(view.getUint8(8), view.getUint8(9), view.getUint8(10), view.getUint8(11));
      if (riff !== 'RIFF' || wave !== 'WAVE') return null;

      let offset = 12;
      const chunks = [];
      while (offset + 8 <= buffer.byteLength) {
        const id = String.fromCharCode(view.getUint8(offset), view.getUint8(offset+1), view.getUint8(offset+2), view.getUint8(offset+3));
        const size = view.getUint32(offset + 4, true);
        const dataOffset = offset + 8;
        if (dataOffset + size > buffer.byteLength) break;
        const padding = (size % 2 !== 0) ? 1 : 0;
        chunks.push({ id, size, offset, dataOffset, padding });
        offset = dataOffset + size + padding;
      }
      return chunks;
    }

    function parseListInfo(buffer, chunk) {
      const info = {};
      if (chunk.size < 4) return info;
      const view = new DataView(buffer, chunk.dataOffset + 4, chunk.size - 4);
      let offset = 0;
      const decoder = new TextDecoder("utf-8");
      while (offset + 8 <= view.byteLength) {
        const subId = String.fromCharCode(view.getUint8(offset), view.getUint8(offset+1), view.getUint8(offset+2), view.getUint8(offset+3));
        const subSize = view.getUint32(offset + 4, true);
        if (offset + 8 + subSize > view.byteLength) break;
        const bytes = new Uint8Array(buffer, chunk.dataOffset + 4 + offset + 8, subSize);
        const str = decoder.decode(bytes).replace(/\0/g, '').trim();
        if (subId === 'INAM') info.title = str;
        if (subId === 'IART') info.artist = str;
        if (subId === 'IGNR') info.genre = str;
        if (subId === 'ICRD') info.year = str;
        offset += 8 + subSize + (subSize % 2 !== 0 ? 1 : 0);
      }
      return info;
    }

    async function processAudioFile(file) {
      const isWav = file.name.toLowerCase().endsWith('.wav');
      const isMp3 = file.name.toLowerCase().endsWith('.mp3');
      if (!file || (!isWav && !isMp3)) {
        alert("Пожалуйста, выберите файл .mp3 или .wav");
        return;
      }
      originalFileName = file.name;
      rawAudioBuffer = await file.arrayBuffer();

      let tags = {};
      let writer = null;
      let listInfo = {};

      if (isWav) {
        const chunks = parseWavChunks(rawAudioBuffer);
        let id3Chunk = null;
        let listInfoChunk = null;

        if (chunks) {
          for (const c of chunks) {
            const idClean = c.id.toLowerCase().trim();
            if (idClean === 'id3') {
              id3Chunk = c;
            } else if (c.id === 'LIST') {
              const view = new DataView(rawAudioBuffer, c.dataOffset, 4);
              const type = String.fromCharCode(view.getUint8(0), view.getUint8(1), view.getUint8(2), view.getUint8(3));
              if (type === 'INFO') listInfoChunk = c;
            }
          }
        }

        if (id3Chunk) {
          const id3Buffer = rawAudioBuffer.slice(id3Chunk.dataOffset, id3Chunk.dataOffset + id3Chunk.size);
          writer = new MP3Tag(id3Buffer);
          writer.read();
          tags = writer.tags || {};
        }

        if (listInfoChunk) {
          listInfo = parseListInfo(rawAudioBuffer, listInfoChunk);
        }
      } else {
        writer = new MP3Tag(rawAudioBuffer.slice(0));
        writer.read();
        tags = writer.tags || {};
      }

      writer = writer || { tags: {} };
      writer.tags.v2 = writer.tags.v2 || {};

      function readTag(v1Val, v2Frame, fallbackVal) {
        if (v1Val && String(v1Val).trim() !== '') return String(v1Val).trim();
        const v2 = writer.tags.v2 ? writer.tags.v2[v2Frame] : null;
        if (v2) {
          if (typeof v2 === 'string' || typeof v2 === 'number') return String(v2).trim();
          if (Array.isArray(v2) && v2.length > 0) {
            const first = v2[0];
            if (typeof first === 'string' || typeof first === 'number') return String(first).trim();
            if (typeof first === 'object' && first !== null) return String(first.text || first.value || '').trim();
          }
          if (typeof v2 === 'object' && v2 !== null) return String(v2.text || v2.value || '').trim();
        }
        if (fallbackVal && String(fallbackVal).trim() !== '') return String(fallbackVal).trim();
        return '';
      }

      document.getElementById("title").value = readTag(tags.title, 'TIT2', listInfo.title);
      document.getElementById("artist").value = readTag(tags.artist, 'TPE1', listInfo.artist);
      document.getElementById("composer").value = readTag(tags.composer, 'TCOM');
      document.getElementById("key").value = readTag('', 'TKEY');
      document.getElementById("bpm").value = readTag('', 'TBPM');
      document.getElementById("year").value = readTag(tags.year, 'TYER', listInfo.year) || readTag('', 'TDRC');
      document.getElementById("genre").value = readTag(tags.genre, 'TCON', listInfo.genre);

      const coverPreview = document.getElementById("coverPreview");
      existingCoverData = null;

      if (writer.tags.v2 && writer.tags.v2.APIC && Array.isArray(writer.tags.v2.APIC) && writer.tags.v2.APIC.length > 0) {
        const apic = writer.tags.v2.APIC[0];
        const mimeType = apic.mime || apic.format || "image/jpeg";
        if (apic.data && apic.data.length > 0) {
          existingCoverData = {
            format: mimeType,
            mime: mimeType,
            type: 3,
            description: "",
            data: apic.data
          };
          const blob = new Blob([new Uint8Array(apic.data)], { type: mimeType });
          coverPreview.src = URL.createObjectURL(blob);
          coverPreview.style.display = "block";
        } else {
          coverPreview.src = "";
          coverPreview.style.display = "none";
        }
      } else {
        coverPreview.src = "";
        coverPreview.style.display = "none";
      }

      coverBuffer = null;
      coverMime = "";

      form.style.display = "block";
      dropZone.querySelector('label').innerHTML = `Файл загружен: <strong>${originalFileName}</strong><br>(перетащите другой, чтобы заменить)`;
    }

    document.getElementById("coverFile").addEventListener("change", async e => {
      const file = e.target.files[0];
      if (!file) return;
      coverMime = file.type || "image/jpeg";
      coverBuffer = await file.arrayBuffer();
      const preview = document.getElementById("coverPreview");
      preview.src = URL.createObjectURL(file);
      preview.style.display = "block";
    });

    document.getElementById("saveBtn").addEventListener("click", () => {
      if (!rawAudioBuffer) return;

      const isWav = originalFileName.toLowerCase().endsWith('.wav');
      const titleVal = document.getElementById("title").value.trim();
      const artistVal = document.getElementById("artist").value.trim();
      const composerVal = document.getElementById("composer").value.trim();
      const keyVal = document.getElementById("key").value.trim();
      const bpmVal = document.getElementById("bpm").value.trim();
      const yearVal = document.getElementById("year").value.trim();
      const genreVal = document.getElementById("genre").value.trim();

      const tagWriter = new MP3Tag(new ArrayBuffer(0));
      tagWriter.tags.title = titleVal;
      tagWriter.tags.artist = artistVal;
      tagWriter.tags.genre = genreVal;
      tagWriter.tags.year = yearVal;

      tagWriter.tags.v2 = {
        TIT2: titleVal,
        TPE1: artistVal,
        TCON: genreVal,
        TYER: yearVal,
        TDRC: yearVal
      };

      if (composerVal) tagWriter.tags.v2.TCOM = composerVal;
      if (keyVal) tagWriter.tags.v2.TKEY = keyVal;
      if (bpmVal) tagWriter.tags.v2.TBPM = bpmVal;

      if (coverBuffer) {
        tagWriter.tags.v2.APIC = [{
          format: coverMime,
          mime: coverMime,
          type: 3,
          description: "",
          data: Array.from(new Uint8Array(coverBuffer))
        }];
      } else if (existingCoverData) {
        tagWriter.tags.v2.APIC = [existingCoverData];
      }

      tagWriter.save({ strict: false, id3v2: { include: true } });

      let downloadName = "";
      const ext = isWav ? ".wav" : ".mp3";

      if (artistVal && titleVal) {
        downloadName = `${artistVal} - ${titleVal}${ext}`;
      } else if (titleVal) {
        downloadName = `${titleVal}${ext}`;
      } else if (artistVal) {
        downloadName = `${artistVal}${ext}`;
      } else {
        downloadName = originalFileName;
      }

      downloadName = downloadName.replace(/[/\\?%*:|"<>]/g, '_');

      if (isWav) {
        const id3Bytes = new Uint8Array(tagWriter.buffer);
        const chunks = parseWavChunks(rawAudioBuffer) || [];
        const retainedChunksData = [];

        for (const chunk of chunks) {
          const idClean = chunk.id.toLowerCase().trim();
          if (idClean === 'id3') continue;
          const totalChunkLen = 8 + chunk.size + chunk.padding;
          const chunkBytes = new Uint8Array(rawAudioBuffer, chunk.offset, totalChunkLen);
          retainedChunksData.push(chunkBytes);
        }

        const id3ChunkHeader = new Uint8Array(8);
        id3ChunkHeader[0] = 0x69; // 'i'
        id3ChunkHeader[1] = 0x64; // 'd'
        id3ChunkHeader[2] = 0x33; // '3'
        id3ChunkHeader[3] = 0x20; // ' '
        const viewHeader = new DataView(id3ChunkHeader.buffer);
        viewHeader.setUint32(4, id3Bytes.length, true);

        const id3Padding = (id3Bytes.length % 2 !== 0) ? new Uint8Array([0]) : new Uint8Array(0);

        let totalPayloadSize = 4;
        for (const cb of retainedChunksData) {
          totalPayloadSize += cb.length;
        }
        totalPayloadSize += 8 + id3Bytes.length + id3Padding.length;

        const finalWavBuffer = new ArrayBuffer(8 + totalPayloadSize);
        const finalUint8 = new Uint8Array(finalWavBuffer);
        const finalView = new DataView(finalWavBuffer);

        finalUint8[0] = 0x52; finalUint8[1] = 0x49; finalUint8[2] = 0x46; finalUint8[3] = 0x46; // 'RIFF'
        finalView.setUint32(4, totalPayloadSize, true);
        finalUint8[8] = 0x57; finalUint8[9] = 0x41; finalUint8[10] = 0x56; finalUint8[11] = 0x45; // 'WAVE'

        let currentOffset = 12;
        for (const cb of retainedChunksData) {
          finalUint8.set(cb, currentOffset);
          currentOffset += cb.length;
        }

        finalUint8.set(id3ChunkHeader, currentOffset);
        currentOffset += 8;
        finalUint8.set(id3Bytes, currentOffset);
        currentOffset += id3Bytes.length;
        if (id3Padding.length > 0) {
          finalUint8.set(id3Padding, currentOffset);
        }

        const blob = new Blob([finalWavBuffer], { type: "audio/wav" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = downloadName;
        link.click();
      } else {
        const mp3Writer = new MP3Tag(rawAudioBuffer.slice(0));
        mp3Writer.read();
        mp3Writer.tags.title = titleVal;
        mp3Writer.tags.artist = artistVal;
        mp3Writer.tags.genre = genreVal;
        mp3Writer.tags.year = yearVal;
        mp3Writer.tags.v2 = tagWriter.tags.v2;
        mp3Writer.save({ strict: false });

        const blob = new Blob([mp3Writer.buffer], { type: "audio/mpeg" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = downloadName;
        link.click();
      }
    });
  </script>
</body>
</html>
